# @package dataset.low_quality_effect.smartphone_playback
mode: set

transform_type: sox_audio_effect

effects:
  - name: 'smartphone_playback'
    params:
      - "bandpass 100 16000" # Typical smartphone speaker range
      - "equalizer 200 2q -4" # Reduce low frequencies (small speakers)
      - "equalizer 1000 1.5q 2" # Boost mids (typical of small speakers)
      - "equalizer 8000 1.5q -3" # Roll off highs
      - "compand 0.2,0.5 6:-70,-60,-20 -5 -90 0.1" # Light compression
      - "gain -n -1" # Slight volume adjustment
      - "channels 1" # Mono output
