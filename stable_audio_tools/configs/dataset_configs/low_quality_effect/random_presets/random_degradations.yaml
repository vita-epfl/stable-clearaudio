# @package dataset.low_quality_effect.random
min_effects: 1
max_effects: 5
available_effects: ["equalizer_1", "equalizer_2", "equalizer_3", "lowpass", "highpass"]

effects:
  - name: equalizer_1
    effect_type: equalizer # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - "equalizer 120 1.0 -30"
  
  - name: equalizer_2
    effect_type: equalizer # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - "equalizer 700 1.2 -25"
  
  - name: equalizer_3
    effect_type: equalizer # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - "equalizer 2000 1.2 30"

  - name: highpass
    effect_type: highpass # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - "highpass 1500"
  
  - name: lowpass
    effect_type: lowpass # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - "lowpass 500"
