transform_type: sox_audio_effect

available_effects: ["intense_equalizer_more"]
randomise_effects: false # If false, applies all the effects in available_effects

min_effects: 1
max_effects: 1

effects:
  - name: 'intense_equalizer_more'
    param_sets:
      # Excessive cuts and boosts in critical areas
      - "equalizer 60 0.5 -40"       # Removes all sub-bass punch
      - "equalizer 250 2.0 40"       # Honks up muddy lower mids aggressively
      - "equalizer 1000 0.3 -35"     # Surgical cut of crucial vocal clarity
      - "equalizer 3000 5.0 50"      # Piercing resonance in the upper mids
      - "equalizer 6000 0.7 -45"     # Sucks out presence and sparkle
      - "equalizer 15000 10.0 60"    # Overemphasizes noise and hiss
    gain: 0.8  # Louder destruction
    weight: 1  # Let it dominate