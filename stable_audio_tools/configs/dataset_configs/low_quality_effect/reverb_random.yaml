transform_type: sox_audio_effect

available_effects: ["reverb"]
randomise_effects: false # If false, applies all the effects in available_effects

min_effects: 1
max_effects: 1

effects:
  - name: reverb
    effect_type: reverb # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - reverberance_min: 40
        reverberance_max: 50
        damping_min: 40
        damping_max: 50
        room_scale_min: 90
        room_scale_max: 100
        stereo_depth_min: 90
        stereo_depth_max: 100
        use_delay: true
        delay_min: 20
        delay_max: 30
        wet_gain_min: 0
        wet_gain_max: 10
    weight: 1
