transform_type: sox_audio_effect

available_effects: ["overdrive"]
randomise_effects: false # If false, applies all the effects in available_effects

min_effects: 1
max_effects: 1

effects:
  - name: overdrive
    effect_type: overdrive # Attack and decay times, transfer function points, gain, initial delay, release time
    param_sets:
      - color_min: 80
        color_max: 90
        gain_min: 20
        gain_max: 25
    weight: 1